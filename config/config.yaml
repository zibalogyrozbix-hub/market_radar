branding:
  name: "AI MARKET RADAR"
  logo_text: "◉ AI MARKET RADAR"
  accent_color: "#00E5A8"

data:
  provider: "twelvedata"    # twelvedata | auto | mt5 | csv | synthetic
  csv_dir: "data/csv"       # files named SYMBOL_TIMEFRAME.csv
  bars: 5000
  min_bars: 600
  max_gap_multiplier: 3.0   # gap > N * timeframe => flagged
  session_symbols: [US500, NAS100]   # nightly gaps are normal for these (gap check relaxed)
  peer_only: [US500, NAS100]         # fetched as cross-market peers, not scanned/posted on their own

symbols:
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD
  - USDCAD
  - USDCHF
  - EURGBP
  - EURJPY
  - GBPJPY
  - AUDJPY
  - EURCHF
  - EURAUD
  - AUDNZD
  - CADJPY
  - XAUUSD
  - BTCUSD
  - US500
  - NAS100

# Twelve Data (free Basic plan: 8 credits/min, 800/day; 1 credit per symbol per request).
# Forex pairs and BTC are auto-mapped (EURUSD -> EUR/USD). The Basic plan covers forex, crypto and US
# equities/ETFs but NOT indices: US500/NAS100 therefore use the SPY/QQQ ETFs as proxies (hourly bars only
# during US sessions). XAG/USD (silver) needs a paid plan (404 on Basic) and was removed. Use `python main.py --check-data` to test every symbol with your key.
twelvedata:
  requests_per_minute: 8      # sliding-window limiter (free plan = 8)
  max_retries: 3
  max_stale_minutes: 240      # newest closed candle older than this => symbol skipped (holiday/API issue)
  symbol_map:
    XAUUSD: "XAU/USD"
    BTCUSD: "BTC/USD"
    US500: "SPY"
    NAS100: "QQQ"

# Weekend / session handling (UTC). FX & metals follow the FX week (closed Fri 22:00 -> Sun 22:00).
regime:
  confirm_candles: 2      # a regime change is announced only after the new regime held for N candles
  donchian_window: 20     # BREAKOUT = close beyond the high/low of the previous N candles (+ ATR ratio > 1.1).
                          # Test alternatives with the `tune-breakout` job, then set e.g. 48. After changing it, run the `train` job
                          # (it is also a model feature, so models must be retrained).

market_hours:
  always_open: [BTCUSD]
  session_only: [US500, NAS100]   # ETF proxies: used as cross-market peers, only US-session bars exist

timeframes: ["H1"]          # MVP: H1. Supported: M5 M15 H1 H4 D1

display_names:
  XAUUSD: "XAU/USD"
  EURUSD: "EUR/USD"
  GBPUSD: "GBP/USD"
  USDJPY: "USD/JPY"
  AUDUSD: "AUD/USD"
  USDCAD: "USD/CAD"
  USDCHF: "USD/CHF"
  EURGBP: "EUR/GBP"
  EURJPY: "EUR/JPY"
  GBPJPY: "GBP/JPY"
  AUDJPY: "AUD/JPY"
  EURCHF: "EUR/CHF"
  EURAUD: "EUR/AUD"
  AUDNZD: "AUD/NZD"
  CADJPY: "CAD/JPY"
  BTCUSD: "BTC/USD"

prediction:
  horizon: 4                # candles ahead
  direction_threshold: 0.0  # |future return| must exceed this for UP; else treated by sign
  baseline_window: 1000     # candles used to estimate base rate of UP

cross_market:
  XAUUSD: ["EURUSD", "US500", "NAS100", "BTCUSD", "USDJPY"]
  EURUSD: ["GBPUSD", "USDJPY", "US500", "XAUUSD"]
  EURGBP: ["EURUSD", "GBPUSD", "EURJPY"]
  EURJPY: ["EURUSD", "USDJPY", "GBPJPY", "US500"]
  GBPJPY: ["GBPUSD", "USDJPY", "EURJPY", "US500"]
  AUDJPY: ["AUDUSD", "USDJPY", "US500", "XAUUSD"]   # جفت risk-on
  EURCHF: ["EURUSD", "USDCHF", "XAUUSD"]
  EURAUD: ["EURUSD", "AUDUSD"]
  AUDNZD: ["AUDUSD", "XAUUSD"]
  CADJPY: ["USDCAD", "USDJPY", "US500"]
  default: ["EURUSD", "US500"]
  window: 100
  baseline_window: 500
  break_threshold: 0.45     # |current - normal| above this => break

anomaly:
  z_threshold: 2.5
  alert_threshold: 80
  window: 100
  use_isolation_forest: true

similarity:
  k: 100                    # neighbours used (was 500 = 10% of the history, too diluted)
  min_history: 800
  min_neighbors: 50         # fewer => similarity reported as N/A (must stay <= k)
  embargo: 8                # bars excluded before "now" (future return must be known)

models:
  logistic: {C: 0.5, max_iter: 500}
  random_forest: {n_estimators: 200, max_depth: 6, min_samples_leaf: 30}
  xgboost: {n_estimators: 200, max_depth: 3, learning_rate: 0.05, subsample: 0.8}
  quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  min_train_rows: 400
  calibration_method: "isotonic"   # isotonic | platt
  min_calibration_rows: 150
  storage: "auto"              # auto | files | db  (auto = db when Turso is configured; stateless CI needs db)
  registry_dir: "data/models"   # used when storage: files
  train_on_scan: false         # false = scans never train (run the `train` job first, then weekly); true = auto-train when no model exists

weights:
  trend_weight: 0.12
  momentum_weight: 0.10
  volatility_weight: 0.05
  anomaly_weight: 0.08
  similarity_weight: 0.20
  ml_weight: 0.40
  cross_market_weight: 0.05

score_weights:
  trend: 0.18
  momentum: 0.16
  volatility: 0.10
  anomaly: 0.14
  similarity: 0.18
  ml: 0.18
  cross_market: 0.06

thresholds:
  min_edge: 0.07            # below => NO CLEAR EDGE (edge = p_side - max(0.5, side base rate); also needs |p-0.5| >= 0.05)
  post_priority: 0.45
  anomaly_alert: 80
  similarity_alert: 85
  volatility_alert: 90
  scan_score: 60
  regime_change_priority: 0.5

priority_weights:
  anomaly: 0.25
  novelty: 0.20
  probability_edge: 0.20
  similarity: 0.15
  regime_change: 0.10
  cross_market: 0.10

publishing:
  scheduled_scan_every_minutes: 60
  daily_summary_hour_utc: 20
  max_posts_per_run: 3
  max_posts_per_day: 20              # channel cap per UTC day (events only). 0 = unlimited. Telegram itself has no daily limit.
  max_posts_per_symbol_per_day: 4
  rolling_window_hours: 6            # a burst (e.g. weekly open) cannot use the whole day budget:
  max_posts_per_rolling_window: 6    #   at most N event posts in any rolling window of `rolling_window_hours` (0 = off)
  max_posts_per_type_per_run:        # the same market-wide story is not posted for every pair in one run
    VOLATILITY_ALERT: 2
    REGIME_CHANGE: 2
  max_event_age_minutes: 120         # candle OPEN time + 1h close + 1h grace; older candles are not announced
  pending_max_age_minutes: 120       # undelivered posts older than this are marked expired instead of sent late
  send_images: true
  cooldown_minutes:
    MARKET_SCAN: 180
    ANOMALY_ALERT: 120
    HISTORICAL_MATCH: 120
    REGIME_CHANGE: 240
    CROSS_MARKET_BREAK: 120
    VOLATILITY_ALERT: 360
    DAILY_MARKET_SUMMARY: 1200
    MODEL_UPDATE: 600
  disclaimer: "Statistical analysis · not financial advice"
  guide_url: "https://telegra.ph/FXSCAN--User-Guide-10-10"   # public reader's guide (Telegraph)
  guide_button: true     # inline button "🧭 How do I use this?" under every post
  quiet_after_open_hours: 3   # no event posts for the first N hours after the weekly FX/metals open (gap candles)
  link_labels: true      # hyperlink labels (Probability, Risk, ...) to guide sections

telegram:
  enabled: true
  retries: 3
  timeout: 20

database:
  url: "sqlite:///data/market_radar.db"   # overridden by TURSO_DATABASE_URL + TURSO_AUTH_TOKEN when set
  initial_candles: 300                    # candles stored on first run per symbol (keeps remote writes small)

logging:
  level: "INFO"
  file: "logs/market_radar.log"
