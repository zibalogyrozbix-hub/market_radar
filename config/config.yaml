branding:
  name: "AI MARKET RADAR"
  logo_text: "◉ AI MARKET RADAR"
  accent_color: "#00E5A8"

data:
  provider: "twelvedata"    # twelvedata | auto | mt5 | csv | synthetic
  csv_dir: "data/csv"       # files named SYMBOL_TIMEFRAME.csv
  bars: 5000
  min_bars: 600
  max_gap_multiplier: 3.0   # gap > N * timeframe => flagged
  session_symbols: [US500, NAS100]   # nightly gaps are normal for these (gap check relaxed)
  peer_only: [US500, NAS100]         # fetched as cross-market peers, not scanned/posted on their own

symbols:
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD
  - USDCAD
  - USDCHF
  - EURGBP
  - EURJPY
  - GBPJPY
  - AUDJPY
  - EURCHF
  - EURAUD
  - AUDNZD
  - CADJPY
  - XAUUSD
  - BTCUSD
  - US500
  - NAS100

# Twelve Data (free Basic plan: 8 credits/min, 800/day; 1 credit per symbol per request).
# Forex pairs and BTC are auto-mapped (EURUSD -> EUR/USD). The Basic plan covers forex, crypto and US
# equities/ETFs but NOT indices: US500/NAS100 therefore use the SPY/QQQ ETFs as proxies (hourly bars only
# during US sessions). XAG/USD (silver) needs a paid plan (404 on Basic) and was removed. Use `python main.py --check-data` to test every symbol with your key.
twelvedata:
  requests_per_minute: 8      # sliding-window limiter (free plan = 8)
  max_retries: 3
  max_stale_minutes: 240      # newest closed candle older than this => symbol skipped (holiday/API issue)
  symbol_map:
    XAUUSD: "XAU/USD"
    BTCUSD: "BTC/USD"
    US500: "SPY"
    NAS100: "QQQ"

# Weekend / session handling (UTC). FX & metals follow the FX week (closed Fri 22:00 -> Sun 22:00).
market_hours:
  always_open: [BTCUSD]
  session_only: [US500, NAS100]   # ETF proxies: used as cross-market peers, only US-session bars exist

timeframes: ["H1"]          # MVP: H1. Supported: M5 M15 H1 H4 D1

display_names:
  XAUUSD: "XAU/USD"
  EURUSD: "EUR/USD"
  GBPUSD: "GBP/USD"
  USDJPY: "USD/JPY"
  AUDUSD: "AUD/USD"
  USDCAD: "USD/CAD"
  USDCHF: "USD/CHF"
  EURGBP: "EUR/GBP"
  EURJPY: "EUR/JPY"
  GBPJPY: "GBP/JPY"
  AUDJPY: "AUD/JPY"
  EURCHF: "EUR/CHF"
  EURAUD: "EUR/AUD"
  AUDNZD: "AUD/NZD"
  CADJPY: "CAD/JPY"
  BTCUSD: "BTC/USD"

prediction:
  horizon: 4                # candles ahead
  direction_threshold: 0.0  # |future return| must exceed this for UP; else treated by sign
  baseline_window: 1000     # candles used to estimate base rate of UP

cross_market:
  XAUUSD: ["EURUSD", "US500", "NAS100", "BTCUSD", "USDJPY"]
  EURUSD: ["GBPUSD", "USDJPY", "US500", "XAUUSD"]
  EURGBP: ["EURUSD", "GBPUSD", "EURJPY"]
  EURJPY: ["EURUSD", "USDJPY", "GBPJPY", "US500"]
  GBPJPY: ["GBPUSD", "USDJPY", "EURJPY", "US500"]
  AUDJPY: ["AUDUSD", "USDJPY", "US500", "XAUUSD"]   # جفت risk-on
  EURCHF: ["EURUSD", "USDCHF", "XAUUSD"]
  EURAUD: ["EURUSD", "AUDUSD"]
  AUDNZD: ["AUDUSD", "XAUUSD"]
  CADJPY: ["USDCAD", "USDJPY", "US500"]
  default: ["EURUSD", "US500"]
  window: 100
  baseline_window: 500
  break_threshold: 0.45     # |current - normal| above this => break

anomaly:
  z_threshold: 2.5
  alert_threshold: 80
  window: 100
  use_isolation_forest: true

similarity:
  k: 500
  min_history: 800
  min_neighbors: 50         # fewer => similarity reported as N/A
  embargo: 8                # bars excluded before "now" (future return must be known)

models:
  logistic: {C: 0.5, max_iter: 500}
  random_forest: {n_estimators: 200, max_depth: 6, min_samples_leaf: 30}
  xgboost: {n_estimators: 200, max_depth: 3, learning_rate: 0.05, subsample: 0.8}
  quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  min_train_rows: 400
  calibration_method: "isotonic"   # isotonic | platt
  min_calibration_rows: 150
  storage: "auto"              # auto | files | db  (auto = db when Turso is configured; stateless CI needs db)
  registry_dir: "data/models"   # used when storage: files
  train_on_scan: false         # false = scans never train (run the `train` job first, then weekly); true = auto-train when no model exists

weights:
  trend_weight: 0.12
  momentum_weight: 0.10
  volatility_weight: 0.05
  anomaly_weight: 0.08
  similarity_weight: 0.20
  ml_weight: 0.40
  cross_market_weight: 0.05

score_weights:
  trend: 0.18
  momentum: 0.16
  volatility: 0.10
  anomaly: 0.14
  similarity: 0.18
  ml: 0.18
  cross_market: 0.06

thresholds:
  min_edge: 0.05            # below => NO CLEAR EDGE
  post_priority: 0.45
  anomaly_alert: 80
  similarity_alert: 85
  volatility_alert: 90
  scan_score: 60
  regime_change_priority: 0.5

priority_weights:
  anomaly: 0.25
  novelty: 0.20
  probability_edge: 0.20
  similarity: 0.15
  regime_change: 0.10
  cross_market: 0.10

publishing:
  scheduled_scan_every_minutes: 60
  daily_summary_hour_utc: 20
  max_posts_per_run: 3
  send_images: true
  cooldown_minutes:
    MARKET_SCAN: 180
    ANOMALY_ALERT: 60
    HISTORICAL_MATCH: 120
    REGIME_CHANGE: 120
    CROSS_MARKET_BREAK: 120
    VOLATILITY_ALERT: 90
    DAILY_MARKET_SUMMARY: 1200
    MODEL_UPDATE: 600
  disclaimer: "Statistical market analysis. Not a trading signal or financial advice."

telegram:
  enabled: true
  retries: 3
  timeout: 20

database:
  url: "sqlite:///data/market_radar.db"   # overridden by TURSO_DATABASE_URL + TURSO_AUTH_TOKEN when set
  initial_candles: 300                    # candles stored on first run per symbol (keeps remote writes small)

logging:
  level: "INFO"
  file: "logs/market_radar.log"
